<!doctype html><html lang="my"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATK AI FLOW · Scene Planner</title><style>body{font:15px system-ui;background:#101421;color:#f3f5fb;margin:0}main{max-width:950px;margin:auto;padding:24px}h1{margin-bottom:4px}.muted{color:#aab4cc}.panel{background:#1b2234;border:1px solid #39445e;border-radius:16px;padding:18px;margin:16px 0}label{display:block;margin:10px 0 6px}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #4c5875;background:#131a2b;color:white}input[type=number]{width:95px}button{cursor:pointer;background:#394b85}button:hover{background:#526bb6}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.scene{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #38435b}.scene input[type=text]{min-width:0;width:95%;box-sizing:border-box}.summary{font-size:19px;font-weight:700}.warn{color:#ffd38b}@media(max-width:600px){.scene{grid-template-columns:1fr 1fr}.scene input[type=text]{grid-column:span 2}}</style><main><h1>ATK AI FLOW</h1><p class="muted">Image / Video Scene Duration Planner</p><section class="panel"><div class="row"><label>Target duration <select id="preset"><option value="120">2 minutes</option><option value="180">3 minutes</option><option value="60">1 minute</option><option value="300">5 minutes</option><option value="custom">Custom</option></select></label><label>Minutes <input id="minutes" type="number" min="0" max="180" value="2"></label><label>Seconds <input id="seconds" type="number" min="0" max="59" value="0"></label><label>Clip length (seconds) <input id="clip" type="number" min="1" max="60" value="5"></label></div><div class="row"><button id="build">Auto create scenes</button><button id="add">+ Add scene</button><button id="export">Export scene plan (JSON)</button></div><p class="muted">Auto-create distributes the target duration into scene clips. Change each scene's length independently.</p></section><section class="panel"><div class="row"><strong class="summary" id="summary"></strong><span id="difference" class="warn"></span></div><div id="scenes"></div></section><p class="muted">Planning only: AI rendering, image generation, and MP4 merging are not enabled on this page.</p></main><script>const $=x=>document.getElementById(x);let scenes=[];function target(){return Math.max(1,Number($('minutes').value||0)*60+Number($('seconds').value||0))}function syncPreset(){const v=$('preset').value;if(v!=='custom'){$('minutes').value=Math.floor(+v/60);$('seconds').value=+v%60}}function make(){let left=target(),clip=Math.max(1,Math.min(60,Math.floor(+$('clip').value||5)));if(Math.ceil(left/clip)>500){alert('Maximum 500 scenes');return}scenes=[];while(left>0){const sec=Math.min(left,clip);scenes.push({kind:'image-to-video',seconds:sec,prompt:''});left-=sec}draw()}function draw(){const total=scenes.reduce((a,s)=>a+s.seconds,0);$('summary').textContent=scenes.length+' scenes · '+Math.floor(total/60)+'m '+total%60+'s';$('difference').textContent=total===target()?'Matches target':(total>target()?'+':'')+(total-target())+' seconds vs target';$('scenes').replaceChildren();scenes.forEach((s,i)=>{const div=document.createElement('div');div.className='scene';const prompt=document.createElement('input');prompt.type='text';prompt.placeholder='Scene '+(i+1)+' prompt';prompt.value=s.prompt;prompt.oninput=()=>s.prompt=prompt.value;const kind=document.createElement('select');[['image','Image'],['image-to-video','Video']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;kind.append(o)});kind.value=s.kind;kind.onchange=()=>s.kind=kind.value;const duration=document.createElement('input');duration.type='number';duration.min=1;duration.max=3600;duration.value=s.seconds;duration.setAttribute('aria-label','Scene seconds');duration.onchange=()=>{s.seconds=Math.max(1,Math.min(3600,Math.floor(+duration.value||1)));draw()};const remove=document.createElement('button');remove.textContent='×';remove.setAttribute('aria-label','Remove scene');remove.onclick=()=>{scenes.splice(i,1);draw()};div.append(prompt,kind,duration,remove);$('scenes').append(div)})}$('preset').onchange=()=>{syncPreset();make()};$('minutes').onchange=()=>{$('preset').value='custom';draw()};$('seconds').onchange=()=>{$('preset').value='custom';draw()};$('build').onclick=make;$('add').onclick=()=>{scenes.push({kind:'image-to-video',seconds:5,prompt:''});draw()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({targetSeconds:target(),totalSeconds:scenes.reduce((a,s)=>a+s.seconds,0),scenes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atk-ai-flow-scene-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};make();</script></html>
